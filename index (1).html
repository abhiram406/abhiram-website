<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Abhiram Chavali | Systems integration, sensing and thermal energy</title>
<meta name="description" content="Portfolio of Abhiram Chavali, engineering leader in systems integration, sensor technologies and thermal energy.">
<link rel="canonical" href="https://abhiram.co.in/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='52' font-size='52'%3E%E2%9A%99%EF%B8%8F%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#EDF0F1">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Abhiram Chavali">
<meta property="og:title" content="Abhiram Chavali | Systems integration, sensing and thermal energy">
<meta property="og:description" content="Engineering leader building defence, safety and monitoring systems. Projects in sensing, hydrogen, thermal energy and machine learning.">
<meta property="og:url" content="https://abhiram.co.in/">
<meta name="twitter:card" content="summary">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EDF0F1; --paper-2:#E1E6E8; --ink:#13212C; --ink-2:#44535F; --line:#C3CCD1;
  --blue:#1B4F8F; --teal:#177F80; --heat:#D8481F; --heat-soft:#F6D9CE; --on-heat:#fff;
  --hdr:4.25rem; --pad:clamp(1.25rem,5vw,4rem); --max:1180px;
  --sans:"Inter","Helvetica Neue",Arial,sans-serif;
  --serif:"Inter","Helvetica Neue",Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0E1A24; --paper-2:#16252F; --ink:#E7EDF0; --ink-2:#A3B2BC; --line:#28394514;
    --line:#2B3C48; --blue:#79ABEB; --teal:#4CC3C0; --heat:#FF7B4F; --heat-soft:#3A2018; --on-heat:#1A0B05;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1A24; --paper-2:#16252F; --ink:#E7EDF0; --ink-2:#A3B2BC; --line:#2B3C48;
  --blue:#79ABEB; --teal:#4CC3C0; --heat:#FF7B4F; --heat-soft:#3A2018; --on-heat:#1A0B05;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 5.5rem);-webkit-text-size-adjust:100%}
body{height:auto;min-height:100%;margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:1.0625rem;line-height:1.6;font-optical-sizing:auto;overflow-x:hidden;transition:background-color .4s,color .4s}
[hidden]{display:none!important}
a{color:inherit}
img{max-width:100%;display:block}
h1,h2,h3,p,ul,ol,dl,dd{margin:0}
ul,ol{padding:0;list-style:none}
:focus-visible{outline:3px solid var(--heat);outline-offset:3px;border-radius:2px}
.skip{position:absolute;left:1rem;top:-4rem;background:var(--ink);color:var(--paper);padding:.6rem 1rem;z-index:100;border-radius:6px;text-decoration:none}
.skip:focus{top:calc(env(safe-area-inset-top,0px) + .5rem)}
.wrap{width:100%;max-width:calc(var(--max) + var(--pad)*2);margin-inline:auto;padding-inline:var(--pad)}

/* Header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:color-mix(in srgb,var(--paper) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;justify-content:space-between;gap:1rem;min-height:var(--hdr)}
.brand{font-weight:700;font-size:1.15rem;letter-spacing:-.02em;text-decoration:none;display:flex;align-items:center;gap:.6rem;white-space:nowrap}
.brand svg{width:34px;height:20px;flex:none}
.nav{position:relative;display:flex;align-items:center;gap:clamp(.9rem,2.6vw,2.2rem)}
.nav a{position:relative;text-decoration:none;font-weight:500;font-size:.98rem;padding:.4rem 0;color:var(--ink-2);transition:color .25s}
.nav a:hover,.nav a[aria-current="page"]{color:var(--ink)}
.nav .ind{position:absolute;bottom:-2px;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--blue),var(--teal),var(--heat));border-radius:3px;transition:transform .5s cubic-bezier(.6,0,.2,1),width .5s cubic-bezier(.6,0,.2,1)}
.tbtn{appearance:none;border:1px solid var(--line);background:transparent;color:var(--ink);width:2.4rem;height:2.4rem;border-radius:50%;display:grid;place-items:center;cursor:pointer;transition:background .25s,transform .4s}
.tbtn:hover{background:var(--paper-2);transform:rotate(25deg)}
.tbtn svg{width:18px;height:18px}
.tbtn .moon{display:none}
:root[data-theme="dark"] .tbtn .sun{display:none}
:root[data-theme="dark"] .tbtn .moon{display:block}
@media (max-width:640px){
  .brand span{display:none}
  .nav{gap:.85rem}
  .nav a{font-size:.92rem}
}

/* Hero */
main{display:block;outline:none}
.hero{position:relative;min-height:calc(100svh - var(--hdr));display:flex;flex-direction:column;justify-content:flex-start;overflow:hidden;isolation:isolate}
.hero .wrap{position:relative;z-index:2;padding-top:clamp(2rem,6vh,4.5rem);padding-bottom:clamp(170px,26vh,230px)}
.hero h1{font-size:clamp(3.2rem,min(10vw,17vh),8.6rem);line-height:.92;font-weight:700;letter-spacing:-.04em}
.hero h1 .ln{display:block;overflow:hidden;padding-bottom:.1em;margin-bottom:-.1em}
.ch{display:inline-block;transform:translateY(110%);animation:rise .95s cubic-bezier(.2,.85,.2,1) forwards;animation-delay:calc(var(--i)*48ms + 120ms)}
@keyframes rise{to{transform:none}}
.hero .lede{max-width:34ch;font-size:clamp(1.35rem,2.8vw,2rem);line-height:1.25;font-weight:500;letter-spacing:-.015em;margin-top:clamp(1.4rem,3.5vh,2.4rem)}
.hero .sub{max-width:54ch;color:var(--ink-2);margin-top:1rem}
.fadein{opacity:0;animation:fade .9s ease forwards;animation-delay:var(--d,1s)}
@keyframes fade{to{opacity:1}}
.cta{display:flex;flex-wrap:wrap;gap:.8rem;margin-top:1.8rem}
.btn{display:inline-flex;align-items:center;gap:.6rem;padding:.8rem 1.35rem;border-radius:999px;font-weight:600;text-decoration:none;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;font:inherit;font-weight:600;transition:background .3s,color .3s,transform .3s,border-color .3s}
.btn:hover{transform:translateY(-2px)}
.btn.solid{background:var(--ink);color:var(--paper)}
.btn.solid:hover{background:var(--heat);border-color:var(--heat);color:var(--on-heat)}
.btn.ghost:hover{background:var(--ink);color:var(--paper)}
.btn svg{width:16px;height:16px;transition:transform .3s}
.btn:hover svg{transform:translateX(3px)}
.sig{position:absolute;left:0;right:0;bottom:0;height:clamp(170px,26vh,230px);z-index:1;width:100%;display:block}
@media (min-width:1000px){.hero .wrap{padding-bottom:clamp(2rem,6vh,4rem)}.sig{left:auto;top:0;bottom:0;right:0;width:58%;height:100%;-webkit-mask-image:linear-gradient(90deg,transparent,#000 24%);mask-image:linear-gradient(90deg,transparent,#000 24%)}}
@media (max-width:640px){.hero .wrap{padding-bottom:170px}}

/* Sections */
section.blk{padding-block:clamp(4rem,10vw,7.5rem);border-top:1px solid var(--line)}
.sh{display:flex;align-items:baseline;justify-content:space-between;gap:1.5rem;flex-wrap:wrap;margin-bottom:clamp(1.8rem,4vw,3rem)}
h2{font-size:clamp(2rem,5vw,3.4rem);line-height:1.05;font-weight:700;letter-spacing:-.035em}
h3{font-weight:650;letter-spacing:-.02em;line-height:1.2}
.more{font-weight:600;text-decoration:none;border-bottom:2px solid var(--heat);padding-bottom:2px;transition:color .25s}
.more:hover{color:var(--heat)}
.muted{color:var(--ink-2)}

.fields{display:grid;grid-template-columns:repeat(3,1fr)}
.fields>div{padding:0 clamp(1rem,3vw,2.5rem);border-left:1px solid var(--line)}
.fields>div:first-child{padding-left:0;border-left:0}
.fields h3{font-size:clamp(1.4rem,2.4vw,1.8rem);margin-bottom:.8rem;background:linear-gradient(90deg,var(--blue),var(--heat)) 0 100%/0 3px no-repeat;padding-bottom:.45rem;transition:background-size .6s cubic-bezier(.6,0,.2,1)}
.fields>div:hover h3{background-size:100% 3px}
@media (max-width:820px){.fields{grid-template-columns:1fr;gap:2rem}.fields>div{border-left:0;padding:0;border-top:1px solid var(--line);padding-top:1.4rem}.fields>div:first-child{border-top:0;padding-top:0}}

/* Link rows */
.frow{position:relative;display:grid;grid-template-columns:9.5rem 1fr auto;gap:1.5rem;align-items:center;padding:1.6rem 0;border-top:1px solid var(--line);text-decoration:none;overflow:hidden}
.frow:last-child{border-bottom:1px solid var(--line)}
.frow::before{content:"";position:absolute;inset:0;background:var(--paper-2);transform:scaleY(0);transform-origin:bottom;transition:transform .45s cubic-bezier(.6,0,.2,1);z-index:-1}
.frow:hover::before,.frow:focus-visible::before{transform:scaleY(1)}
.frow .when{color:var(--ink-2);font-size:.95rem}
.frow h3{font-size:clamp(1.25rem,2.4vw,1.75rem);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.frow:hover h3{transform:translateX(.6rem)}
.frow p{color:var(--ink-2);margin-top:.35rem;max-width:62ch;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.frow:hover p{transform:translateX(.6rem)}
.go{width:2.8rem;height:2.8rem;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;transition:background .3s,color .3s,transform .4s,border-color .3s}
.go svg{width:16px;height:16px}
.frow:hover .go{background:var(--heat);border-color:var(--heat);color:var(--on-heat);transform:rotate(-45deg)}
@media (max-width:700px){.frow{grid-template-columns:1fr auto;gap:.4rem 1rem}.frow .when{grid-column:1/-1}}

/* Contact */
.contact{display:grid;grid-template-columns:1.3fr 1fr;gap:clamp(2rem,6vw,5rem);align-items:end}
.contact h2{font-size:clamp(2.2rem,6vw,4.4rem)}
.mail{display:inline-block;font-size:clamp(1.15rem,3vw,1.9rem);font-weight:650;letter-spacing:-.02em;text-decoration:none;background:linear-gradient(90deg,var(--blue),var(--teal),var(--heat)) 0 100%/100% 3px no-repeat;padding-bottom:.25rem;word-break:break-all;transition:background-size .4s}
.mail:hover{background-size:100% 100%;color:#fff}
.clist{display:grid;gap:.7rem;margin-top:1.4rem}
.clist a{text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:.6rem;display:flex;justify-content:space-between;gap:1rem;transition:border-color .25s,padding .3s}
.clist a:hover{border-color:var(--heat);padding-left:.4rem}
.clist span{color:var(--ink-2)}
@media (max-width:820px){.contact{grid-template-columns:1fr}}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 1.5rem);transform:translate(-50%,200%);background:var(--ink);color:var(--paper);padding:.75rem 1.2rem;border-radius:999px;z-index:95;font-weight:500;transition:transform .45s cubic-bezier(.2,.9,.2,1),opacity .3s;max-width:90vw;text-align:center;visibility:hidden;opacity:0}
.toast.show{visibility:visible;opacity:1}
.toast.show{transform:translate(-50%,0)}

/* Page heads */
.phead{padding-block:clamp(3rem,8vw,6rem) clamp(2rem,4vw,3rem)}
.phead h1{font-size:clamp(2.8rem,9vw,7rem);line-height:.95;font-weight:700;letter-spacing:-.04em}
.phead p{max-width:52ch;color:var(--ink-2);font-size:1.2rem;margin-top:1.2rem}

/* About */
.intro{display:grid;grid-template-columns:minmax(0,320px) 1fr;gap:clamp(2rem,6vw,5rem);align-items:start}
.portrait{position:relative;max-width:320px}
.portrait::before{content:"";position:absolute;inset:.9rem -.9rem -.9rem .9rem;border-radius:4px;background:linear-gradient(160deg,var(--blue),var(--teal) 55%,var(--heat));z-index:0}
.portrait img{position:relative;z-index:1;width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:4px;background:var(--paper-2)}
.bio p{font-size:1.2rem;max-width:62ch}
.bio p+p{margin-top:1.1rem}
.bio p:first-child{font-size:clamp(1.4rem,2.6vw,1.9rem);line-height:1.3;letter-spacing:-.015em;font-weight:500}
.facts{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1.8rem}
.chip{display:inline-block;padding:.35rem .85rem;border:1px solid var(--line);border-radius:999px;font-size:.92rem;color:var(--ink-2)}
@media (max-width:820px){.intro{grid-template-columns:1fr}.portrait{max-width:240px;margin-right:.9rem}}

.tl{position:relative;padding-left:clamp(1.6rem,4vw,3rem)}
.tl::before{content:"";position:absolute;left:6px;top:.4rem;bottom:0;width:2px;background:var(--line)}
.tl .fill{position:absolute;left:6px;top:.4rem;width:2px;height:0;background:linear-gradient(180deg,var(--blue),var(--teal),var(--heat))}
.job{position:relative;padding-bottom:clamp(2.2rem,5vw,3.4rem)}
.job:last-child{padding-bottom:0}
.job::before{content:"";position:absolute;left:calc(-1*clamp(1.6rem,4vw,3rem) + 0px);top:.55rem;width:14px;height:14px;border-radius:50%;background:var(--paper);border:2px solid var(--line);transition:background .4s,border-color .4s,transform .4s}
.job.on::before{background:var(--heat);border-color:var(--heat);transform:scale(1.25)}
.job .dt{color:var(--ink-2);font-size:.95rem}
.job h3{font-size:clamp(1.35rem,2.6vw,1.9rem);margin-top:.15rem}
.job .org{font-weight:500;color:var(--ink-2);margin-top:.1rem}
.job ul{margin-top:.9rem;display:grid;gap:.55rem;max-width:68ch}
.job li{position:relative;padding-left:1.1rem}
.job li::before{content:"";position:absolute;left:0;top:.72em;width:6px;height:2px;background:var(--heat)}

.two{display:grid;grid-template-columns:1fr 1fr;gap:clamp(2rem,6vw,5rem)}
@media (max-width:820px){.two{grid-template-columns:1fr}}
.two h3{font-size:1.5rem;margin-bottom:1.1rem}
.item{padding:1rem 0;border-top:1px solid var(--line)}
.item:last-child{border-bottom:1px solid var(--line)}
.item b{font-weight:650;display:block}
.item span{color:var(--ink-2);font-size:.95rem}
.skills dt{font-weight:650;margin-top:1.2rem}
.skills dd{color:var(--ink-2);margin-top:.2rem}
details.earlier{border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
details.earlier summary{cursor:pointer;list-style:none;padding:1.1rem 0;font-weight:650;display:flex;justify-content:space-between;align-items:center}
details.earlier summary::-webkit-details-marker{display:none}
details.earlier summary i{width:1.1rem;height:1.1rem;position:relative;transition:transform .4s}
details.earlier summary i::before,details.earlier summary i::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:currentColor}
details.earlier summary i::after{transform:rotate(90deg)}
details.earlier[open] summary i{transform:rotate(45deg)}
details.earlier .body{padding-bottom:1rem;display:grid;gap:.9rem}
details.earlier .body div{display:grid;grid-template-columns:9.5rem 1fr;gap:1rem}
details.earlier .body span{color:var(--ink-2);font-size:.95rem}
@media (max-width:640px){details.earlier .body div{grid-template-columns:1fr;gap:.1rem}}

/* Projects */
.filters{display:flex;flex-wrap:wrap;gap:.6rem;margin-bottom:2rem}
.fbtn{appearance:none;font:inherit;font-weight:550;font-size:.95rem;padding:.5rem 1.05rem;border-radius:999px;border:1.5px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;transition:background .3s,color .3s,border-color .3s}
.fbtn:hover{border-color:var(--ink)}
.fbtn[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.proj{position:relative;border-top:1px solid var(--line);transition:opacity .22s}
.proj:last-child{border-bottom:1px solid var(--line)}
.proj.dim{opacity:0}
.proj::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(180deg,var(--blue),var(--teal),var(--heat));transform:scaleY(0);transform-origin:top;transition:transform .5s cubic-bezier(.6,0,.2,1)}
.proj.open::before{transform:scaleY(1)}
.phd{all:unset;box-sizing:border-box;width:100%;display:grid;grid-template-columns:9.5rem 1fr auto;gap:1.5rem;align-items:center;padding:1.7rem 0 1.7rem .2rem;cursor:pointer;transition:padding .4s cubic-bezier(.2,.8,.2,1)}
.phd:hover,.proj.open .phd{padding-left:1.4rem}
.phd:focus-visible{outline:3px solid var(--heat);outline-offset:-3px}
.phd .when{color:var(--ink-2);font-size:.95rem}
.phd h3{font-size:clamp(1.25rem,2.5vw,1.85rem)}
.phd .org{color:var(--ink-2);margin-top:.3rem}
.plus{width:2.6rem;height:2.6rem;border-radius:50%;border:1.5px solid var(--ink);position:relative;transition:transform .45s cubic-bezier(.2,.8,.2,1),background .3s,border-color .3s}
.plus::before,.plus::after{content:"";position:absolute;left:50%;top:50%;width:14px;height:2px;background:currentColor;transform:translate(-50%,-50%)}
.plus::after{transform:translate(-50%,-50%) rotate(90deg);transition:transform .45s}
.proj.open .plus{transform:rotate(180deg);background:var(--heat);border-color:var(--heat);color:var(--on-heat)}
.proj.open .plus::after{transform:translate(-50%,-50%) rotate(0)}
.panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .55s cubic-bezier(.6,0,.2,1)}
.panel>div{overflow:hidden;visibility:hidden;transition:visibility 0s .55s}
.proj.open .panel{grid-template-rows:1fr}
.proj.open .panel>div{visibility:visible;transition-delay:0s}
.pbody{display:grid;grid-template-columns:9.5rem 1fr;gap:1.5rem;padding:0 0 2.2rem .2rem}
.proj.open .pbody{padding-left:1.4rem}
.pbody .txt{max-width:66ch}
.pbody .txt p+p{margin-top:.9rem}
.pbody .sum{font-size:1.2rem;font-weight:500;letter-spacing:-.01em;margin-bottom:1rem}
.kf{display:grid;gap:.55rem;margin-top:1.4rem;padding:1.1rem 1.2rem;background:var(--paper-2);border-left:3px solid var(--heat)}
.kf li{position:relative;padding-left:1rem}
.kf li::before{content:"";position:absolute;left:0;top:.7em;width:5px;height:5px;border-radius:50%;background:var(--heat)}
.tags{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:1.2rem}
.tags .chip{font-size:.85rem;padding:.2rem .7rem}
@media (max-width:700px){.phd{grid-template-columns:1fr auto;gap:.3rem 1rem}.phd .when{grid-column:1/-1}.pbody{grid-template-columns:1fr}.pbody>span{display:none}}


.pbody .txt{max-width:900px}
.pbody .txt p,.pbody .kf{max-width:66ch}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:1.4rem;margin-top:1.8rem;align-items:start}
.figs.one{grid-template-columns:minmax(0,760px)}
.figs figure{margin:0}
.fz{all:unset;box-sizing:border-box;display:block;width:100%;cursor:zoom-in;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#fff;transition:border-color .3s,transform .4s cubic-bezier(.2,.8,.2,1)}
.fz:hover{border-color:var(--heat);transform:translateY(-3px)}
.fz:focus-visible{outline:3px solid var(--heat);outline-offset:3px}
.fz img{width:100%;height:auto;display:block}
.figs figcaption{margin-top:.6rem;font-size:.92rem;line-height:1.45;color:var(--ink-2);max-width:60ch}
.lb{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:clamp(1rem,4vw,3rem);background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .3s ease;cursor:zoom-out}
.lb.show{opacity:1;pointer-events:auto}
.lb img{max-width:100%;max-height:100%;border:1px solid var(--line);border-radius:6px;background:#fff;transform:scale(.97);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.lb.show img{transform:none}

/* Articles */
.alist .frow .tagline{font-size:.92rem;color:var(--ink-2);margin-top:.5rem}
.rbar{position:fixed;left:0;top:env(safe-area-inset-top,0px);height:3px;width:100%;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,var(--blue),var(--teal),var(--heat));z-index:60}
.reader{max-width:calc(70ch + var(--pad)*2);margin-inline:auto;padding:clamp(2rem,6vw,4rem) var(--pad) 0}
.back{display:inline-flex;align-items:center;gap:.5rem;text-decoration:none;font-weight:600;color:var(--ink-2);transition:color .25s,gap .3s}
.back:hover{color:var(--heat);gap:.8rem}
.back svg{width:16px;height:16px;transform:rotate(180deg)}
.reader h1{font-size:clamp(2.2rem,6vw,4rem);line-height:1.02;font-weight:700;letter-spacing:-.04em;margin:1.4rem 0 1rem}
.reader .meta{color:var(--ink-2);display:flex;flex-wrap:wrap;gap:.5rem 1.2rem}
.prose{font-family:var(--sans);font-size:clamp(1.05rem,1.6vw,1.15rem);line-height:1.75;margin-top:2.4rem;font-optical-sizing:auto}
.prose p{margin-top:1.2rem}
.prose .dek{font-size:1.2em;line-height:1.5;color:var(--ink-2);margin-top:0}
.prose h2{font-family:var(--sans);font-size:clamp(1.5rem,3vw,2rem);letter-spacing:-.025em;margin-top:2.8rem;line-height:1.15}
.prose dfn{font-style:normal;font-weight:600;background:linear-gradient(transparent 62%,var(--heat-soft) 62%)}
.prose em{font-style:italic}
.prose ol{margin-top:1.2rem;display:grid;gap:.7rem;counter-reset:s;padding-left:0}
.prose ol li{counter-increment:s;position:relative;padding-left:2.4rem}
.prose ol li::before{content:counter(s);position:absolute;left:0;top:.2em;width:1.6rem;height:1.6rem;border-radius:50%;background:var(--ink);color:var(--paper);font-family:var(--sans);font-size:.85rem;font-weight:600;display:grid;place-items:center;line-height:1}
.case{margin-top:2rem;padding:1.4rem 1.5rem 1.6rem;border:1px solid var(--line);border-top:4px solid var(--teal);background:var(--paper-2)}
.case h2{margin-top:0!important;font-size:1.35rem!important}
.case>p:first-of-type{margin-top:.8rem}
.nextart{margin-top:4rem;padding-bottom:clamp(3rem,8vw,6rem)}
.nextart .frow{border-bottom:1px solid var(--line)}
.note{margin-top:2.4rem;font-family:var(--sans);font-size:.92rem;color:var(--ink-2);border-top:1px solid var(--line);padding-top:1rem}

/* Footer */
.ftr{border-top:1px solid var(--line);padding-block:2rem;color:var(--ink-2);font-size:.92rem}
.ftr .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:.6rem 2rem}

/* scroll reveal (used sparingly) */
.rv{opacity:0;transform:translateY(14px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.8,.2,1);transition-delay:var(--rd,0s)}
.rv.in{opacity:1;transform:none}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important;transition-delay:0s!important}
  .ch{transform:none}.fadein{opacity:1}.rv{opacity:1;transform:none}
}
</style>

var PROJECTS = [
 {id:"ndt", cat:"sense", when:"2025 to now", title:"Microwave scanner that finds hidden defects in composite shells",
  org:"Synergy Measurement Technologies, for ASL-DRDO",
  sum:"A robot-driven microwave system that inspects carbon-fibre (CFRP) shells without damaging them, then maps every defect it finds.",
  body:[
   "Non-destructive testing (NDT, also called NDE for evaluation) checks a part for flaws without cutting or breaking it. Carbon-fibre composite (CFRP) shells can hide defects such as delamination, debonding between layers, voids and inclusions that are invisible from the surface. This system finds them with microwaves.",
   "A 6-axis robotic arm on a linear rail moves an open-ended waveguide probe over the shell, holding it square to the surface at a constant stand-off distance set by laser displacement sensors. A vector network analyzer (VNA) records the reflected microwave signal, its S11 reflection in magnitude and phase, at every position. The data acquisition software ties each measurement to its coordinates.",
   "Signal processing and machine learning turn those readings into defect presence, type, depth and size, with a confidence score on each call. The models are classical gradient-boosted decision trees rather than deep learning, because labelled data is limited and every call must be explainable to the customer. Results appear as 2D heatmaps and 3D defect views on the shell\u2019s geometry, and any flagged point can be revisited and re-inspected.",
   "I lead the integration of the whole system and work hands-on with the models. I also drove the pre-order R&D, on-site demonstrations and proof-of-concept work that helped win the project. The preliminary design review was submitted to ASL in April 2026."],
  facts:["Robot arm and linear rail, with the probe held at a constant stand-off by laser sensors","Staged machine-learning pipeline with confidence scores and explainability","2D and 3D defect visualisation, with point-revisit for verification","Status: design review submitted, April 2026"],

  sum:"Control and data-collection software for a modified survey van that profiles highways with cameras, lasers and GPS.",
  body:[
   "A Network Survey Vehicle (NSV) is a van fitted with sensors that records the condition of a highway as it drives along. I led delivery of the control software and system integration for an NSV used in Roadworks\u2019 highway network monitoring. The platform brings together the van\u2019s cameras, laser displacement sensors for road profiling, GPS positioning and dedicated power units. A data acquisition (DAQ) unit sits at the centre, collecting from every sensor and camera.",
   "Operators see live camera feeds and sensor readings, so they can check quality while the survey is running. The software supports up to 13 sensors and is built to take more as requirements grow. Data and media export to templates that match each customer\u2019s specifications.",
   "It is designed for real field conditions: it copes with the vehicle changing direction during a survey, and it backs data up automatically after unexpected power events."],
  facts:["Up to 13 sensors supported, with room to expand","Live view of four cameras plus sensor traces","Automatic data backup on power events","Export templates matched to customer specifications"],
  tags:["Systems integration","Data acquisition","Highway survey","Python"]},

 {id:"bel", cat:"sense", when:"3-month project", title:"Amplitude and phase tracking test system for BEL",
  org:"Synergy Measurement Technologies, with Bharat Electronics, Hyderabad",
  sum:"Test-automation software that lets technicians check three types of RF receiver module from one interface.",
  body:[
   "Bharat Electronics (BEL) tests critical RF modules used in naval applications. Each module type used to need its own software tools and procedures. Over a three-month collaboration, Synergy built Python-based automated test equipment (ATE) software that tracks the amplitude and phase of Switch Filter Banks (SFB), Quad Superhet Receivers (QSRx) and Homodyne Receivers (HMRx) from a single window.",
   "It works in both RF mode and BITE (built-in test equipment) mode, and switches between them smoothly. It controls the signal generator, network analyzer and a multi-channel power supply, checks that every instrument is connected before a test starts, and guides technicians with pop-up instructions. Results export in several formats for the quality management system."],
  facts:["One interface for three module types: SFB, QSRx and HMRx","RF and BITE modes with seamless switching","Controls signal generator, network analyzer and power supply, with emergency power shut-off","Delivered in three months"],
  tags:["Test automation","RF testing","Python","Instrument control","Defence"]},

 {id:"hal", cat:"sense", when:"1-month project", title:"Audio analyzer control interface for HAL",
  org:"Synergy Measurement Technologies, for Hindustan Aeronautics Limited",
  sum:"A Python interface, built in one month, that replaces hand-written commands for a Keysight U8903B audio analyzer.",
  body:[
   "Hindustan Aeronautics Limited (HAL) wanted simpler operation of its Keysight U8903B audio analyzer in aerospace testing. Normally an engineer has to remember SCPI, the standard text command language for programming test instruments. This interface sends those commands over Ethernet (TCP/IP), so engineers set up a signal with ordinary controls instead.",
   "They choose the waveform (sine, square, triangle, or a custom WAV file), set amplitude in volts or Vrms, frequency and offset, then pick the output connector, impedance and grounding, and play the signal once or on a loop. The software checks the connection and the parameters before it sends anything, which prevents settings that could damage equipment or invalidate a test. Delivered in one month, with documentation and a quick-start guide."],
  facts:["Delivered in one month","Custom WAV upload and playback","Real-time parameter validation and equipment status"],
  tags:["Test automation","SCPI","Python","Aerospace"]},

 {id:"shm", cat:"sense", when:"Feb to Jul 2024", title:"Wireless structural health monitoring near Bengaluru International Airport",
  org:"MSPL, for Bengaluru International Airport Ltd. (BIAL)",
  sum:"Wireless vibration sensors on three structures, and six weeks of data that showed the spans are stable.",
  body:[
   "As Engineering Consultant with MSPL, I completed the installation of Resensys wireless structural health monitoring systems on three structures near the airport: two road-over-bridge spans and a vehicular underpass. The work covered the site survey, technical training, and setup of five 3D vibration accelerometers (SenSpots) and three Senimax units that collect and transmit their data. Installation ran from 21 February to 4 March 2024.",
   "I then monitored the data and wrote the installation report, covering six weeks from 10 June to 22 July 2024. The dominant vibration frequencies sat between 10 and 15 Hz, mostly clustered around 10 to 12 Hz, and stayed the same from week to week. Peak particle velocity, a measure of how fast the structure moves, stayed well below the 50 mm/s damage limit and the recommended 25 mm/s alert level taken from BS 7385-2. The sensor on the underpass barely triggered at all, consistent with a short span far from the traffic above it.",
   "Because a week-to-week shift in these frequency clusters would indicate structural change, the report recommends continued monitoring."],
  facts:["3 structures, 5 accelerometers, 3 data units","6 weeks of data, 10 June to 22 July 2024","Frequencies stable at 10 to 12 Hz across all six weeks","Peak velocities well below the 25 mm/s alert level"],

 {id:"h2", cat:"energy", when:"2020 to 2022", title:"Hydrogen in the Gas Network: can existing engines run on blends?",
  org:"Karlsruhe Institute of Technology, with German federal agencies and industry",
  sum:"A feasibility and risk study of mixing hydrogen into compressed natural gas, from the engine\u2019s point of view.",
  body:["This multi-stakeholder programme was funded by German federal agencies and industry partners including Daimler, Bosch, Air Liquide and Airbus. I was the lead researcher on the engine side: what happens to a combustion engine when up to 20 to 30% hydrogen is blended into natural gas pipelines?",
   "I gathered and analysed data from more than 200 research papers, then built a simple single-cylinder engine model in GT-Power to compare blends on power, efficiency, emissions and engine knock. The work indicated that 20 to 30% hydrogen can potentially let existing engines run normally without drastic optimisation, and it was used to inform infrastructure adoption decisions. I also surveyed options for storing hydrogen and hydrogen-natural gas blends on board."],
  facts:["200+ research papers analysed","Single-cylinder GT-Power model across blends","Findings fed into infrastructure adoption decisions"],
  tags:["Hydrogen","Combustion","Engine knock","GT-Power","Research"]},

 {id:"transhyde", cat:"energy", when:"Jun to Dec 2022", title:"TransHyDE-Norm: a database of standards for liquid hydrogen transport",
  org:"Karlsruhe Institute of Technology, with IKEM and DVGW",
  sum:"Mapping the rules that govern moving liquid hydrogen, and finding where they run out.",
  body:["TransHyDE is a large initiative that evaluates and tests hydrogen transport solutions through demonstration projects. Its TransHyDE-Norm sub-project works on standardising how hydrogen and other chemical energy carriers are transported, distributed and stored.",
   "Our part was a database of norms, standards and policies governing the transport of liquid hydrogen, built from existing literature on cryogenic fluid storage. The aim was to identify regulatory gaps and propose ways to close them: direct experience translating engineering reality into policy and standards."],
  facts:["Focus on liquid hydrogen","Goal: find regulatory gaps and potential solutions"],
  tags:["Hydrogen","Standards","Policy","Cryogenics"]},

 {id:"toyota", cat:"sim", when:"Apr 2018 to Mar 2019", title:"A machine-learning optimiser that cut engine combustion tuning from three weeks to one",
  org:"Master thesis at TOYOTA GAZOO Racing Europe, with RWTH Aachen",
  sum:"A black-box model and optimiser that estimates combustion parameters from operating conditions, tested on six Toyota engines.",
  body:[
   "Engine simulations only predict a real engine\u2019s burn rate if their combustion model is calibrated to measured data. That calibration was slow and manual. For one production engine, 30 operating points took an estimated 120 hours, or three working weeks.",
   "I generated more than 70,000 simulated combinations of engine parameters in GT-Power and trained Gaussian Process regression models in ETAS-ASCMO on them. Each model predicts one of four multipliers of GT-Power\u2019s SITurb combustion model from the engine speed, spark timing, mixture and other operating conditions. In MATLAB, I wrote an optimisation algorithm on top of those models and wrapped it in a standalone application I called the Machine-Learning Optimizer. It imports test-bench data from Excel, optimises a single point or many, and exports the results.",
   "On held-out test data the four models reached R\u00b2 scores between about 0.95 and 0.98. I validated the optimiser on five production engines, including a WRC-winning engine, and one concept engine from Toyota\u2019s portfolio. For the same 30 operating points, the thesis estimates about 5 hours and roughly \u20ac1,100 against about \u20ac24,000 with the standard process."],
  facts:["70,000+ simulated parameter combinations","About 120 hours cut to about 5 hours for 30 operating points","Four models with R\u00b2 between 0.95 and 0.98 on test data","Validated on five production engines and one concept engine"],

 {id:"hydrogen-knock", title:"Why hydrogen makes an engine knock, and why a little is fine",
  dek:"Mixing hydrogen into natural gas pulls on engine knock from two directions at once. Here is how to think about it.",
  tags:["Hydrogen","Combustion"], mins:6,
  body:
  '<p class="dek">Engines that run on natural gas are already on the road. If hydrogen is blended into the gas network, those engines will receive a different fuel than they were designed for. The question is how different they can tolerate.</p>'+
  '<p>Some quick vocabulary first. <dfn>CNG</dfn> is compressed natural gas, mostly methane stored under pressure. <dfn>HCNG</dfn> is hydrogen-enriched CNG: the same gas with some percentage of hydrogen mixed in. <dfn>Knock</dfn> is the metallic pinging sound an engine makes when fuel burns in an uncontrolled way, which I explain next.</p>'+
  '<h2>What knock actually is</h2>'+
  '<p>In a petrol or gas engine, a spark lights the fuel and a flame spreads outward across the cylinder, like a wave moving across a pond. As it travels, it squeezes the not-yet-burnt gas ahead of it. Engineers call that leftover pocket the <dfn>end gas</dfn>.</p>'+
  '<p>Squeezed gas gets hot. If it gets hot enough before the flame arrives, it ignites by itself, a process called <dfn>autoignition</dfn>. Think of popcorn: a kernel can pop from the heat of the pan without any flame touching it. When a whole pocket of end gas pops at once, the pressure wave hammers the cylinder walls. That hammering is knock, and over time it can damage pistons.</p>'+
  '<h2>Two forces pulling in opposite directions</h2>'+
  '<p>Hydrogen changes two things at the same time.</p>'+
  '<ol><li><strong>It burns faster.</strong> A fast flame crosses the cylinder quickly, so the end gas has less time to get hot enough to pop. That helps.</li>'+
  '<li><strong>It lowers the fuel\u2019s knock rating.</strong> Gaseous fuels are scored on a scale called the <dfn>methane number</dfn>, which works like octane does for petrol. Methane is defined as 100 and hydrogen as 0, so a higher number means more resistance to knock. Adding hydrogen drags the number down.</li></ol>'+
  '<p>Which force wins depends on how much hydrogen is in the blend and on the engine\u2019s settings: how much it compresses the mixture, when the spark fires, and how lean the air-fuel mixture is. So the useful question is not <em>does hydrogen cause knock?</em> but <em>how much margin does this engine have?</em> It is like adding passengers to a lift: fine up to a point, and the point depends on the lift.</p>'+
  '<aside class="case"><h2>Case study: turning 200 papers into one answer</h2>'+
  '<p>At Karlsruhe Institute of Technology (KIT), I was the lead researcher on the engine side of \u201cHydrogen in the Gas Network\u201d, a programme funded by German federal agencies and industry partners such as Daimler and Bosch. The question from the pipeline side was practical: how much hydrogen can go into the gas before engines start to suffer?</p>'+
  '<ol><li><strong>Gather.</strong> I collected and analysed data from more than 200 research papers on HCNG engines, pulling out how power, efficiency, emissions and knock changed with hydrogen content.</li>'+
  '<li><strong>Model.</strong> I built a simple single-cylinder engine model in <dfn>GT-Power</dfn>, a simulation tool for engines. Modelling one cylinder as a representative of the whole engine keeps the model fast enough to try many blends.</li>'+
  '<li><strong>Compare.</strong> I ran the blends side by side on power, efficiency, emissions and knock.</li></ol>'+
  '<p>The result: blends of 20 to 30% hydrogen can potentially let existing engines run normally without drastic re-optimisation. That kind of answer, with a stated margin, is what infrastructure planners can actually use.</p></aside>'+
  '<h2>What I took from it</h2>'+
  '<p>Most hydrogen debates are framed as yes or no. Engines are better described by margins. When you can say how much headroom an engine has and what eats it up, the conversation moves from fear to engineering.</p>'},

 {id:"engine-surrogate", title:"From three weeks to one: teaching a model to stand in for engine simulations",
  dek:"How a master thesis at Toyota's motorsport division used machine learning to shortcut a slow tuning loop.",
  tags:["Machine learning","Engine simulation"], mins:6,
  body:
  '<p class="dek">Simulation lets engineers test an engine before building it. But if every test takes a long time, the tuning of an engine still takes weeks. The trick is to simulate just enough, then let a model fill in the rest.</p>'+
  '<p>A few terms first. A <dfn>simulation</dfn> here means a computer model of an engine that predicts what happens inside it. <dfn>Optimisation</dfn> means searching for the settings that give the best result, for example the best combustion behaviour at a given load and speed. A <dfn>black-box model</dfn> is one that predicts outputs from inputs without describing the physics in between.</p>'+
  '<h2>An analogy: weather stations</h2>'+
  '<p>Suppose you have temperature readings from 50 towns and want the temperature in a village between them. You would not fly a drone over the village. You would estimate it from its neighbours. A good estimate also tells you how sure it is: confident near a town with a station, less so far from any.</p>'+
  '<p><dfn>Gaussian Process regression</dfn> does exactly that, but for any set of inputs. You give it examples of inputs and outputs, and it returns a smooth prediction function along with an uncertainty estimate. Each full simulation is a weather station. The model estimates everything in between.</p>'+
  '<aside class="case"><h2>Case study: a thesis at TOYOTA GAZOO Racing Europe</h2>'+
  '<p>For my master thesis in Cologne, the task was to estimate the turbulent combustion parameters of an engine, the numbers that describe how fast and how fiercely the fuel burns, and to do it much faster than the existing method, which took about three weeks per engine.</p>'+
  '<ol><li><strong>Simulate widely.</strong> In GT-Power, I generated more than 70,000 simulated combinations of engine parameters.</li>'+
  '<li><strong>Learn the map.</strong> With ETAS-ASCMO, I used Gaussian Process regression to learn how user-defined operating conditions map to the combustion outputs.</li>'+
  '<li><strong>Optimise on the model.</strong> In MATLAB, I wrote an optimisation algorithm that searches the cheap model instead of the expensive simulation, and wrapped it in a graphical user interface (GUI) so engineers could use it without touching code.</li>'+
  '<li><strong>Test against real portfolios.</strong> I validated it on five production engines, including a WRC-winning engine, and one concept engine from Toyota\u2019s portfolio.</li></ol>'+
  '<p>The result: the optimisation cycle could drop from three weeks to under one, with projected savings of about \u20ac20,000 per engine. These are projected figures, because they come from the thesis analysis rather than a long production run.</p></aside>'+
  '<h2>What I took from it</h2>'+
  '<p>The model held up across six different engines, and that mattered more to me than the headline numbers. A shortcut that only works on one engine is a demo. One that holds across a portfolio is a tool.</p>'+
  '<p>I also had to learn machine learning, engine optimisation and several software packages while doing the thesis. It taught me that being able to learn the next tool quickly is worth more than knowing one tool well.</p>'},

 {id:"listening-to-bridges", title:"Listening to a bridge: how small vibrations reveal structural health",
  dek:"A structure rings like a guitar string. When it changes, its pitch changes. Sensors can hear that.",
  tags:["Sensors","Structural monitoring"], mins:5,
  body:
  '<p class="dek">Bridges, flyovers and buildings age quietly. Cracks and loosened connections rarely announce themselves, but they do change how a structure moves.</p>'+
  '<p><dfn>Structural health monitoring</dfn> (SHM) is the practice of fitting a structure with sensors so its condition can be tracked over time instead of inspected once in a while. The key sensor is the <dfn>accelerometer</dfn>, a small device that measures how quickly something is speeding up or slowing down, which in practice means measuring vibration. The device that digitises and records those signals is called <dfn>data acquisition</dfn> hardware, often shortened to DAQ.</p>'+
  '<h2>An analogy: the guitar string</h2>'+
  '<p>Pluck a guitar string and it rings at a particular pitch. Tighten it and the pitch rises. Loosen it and the pitch drops. A bridge is the same kind of object, just slower. It has <dfn>natural frequencies</dfn>, rates at which it prefers to vibrate, which are set by its mass and its stiffness. Traffic, wind and even footsteps keep \u201cplucking\u201d it all day.</p>'+
  '<p>If damage or wear makes part of the structure less stiff, its natural frequencies tend to drift. You do not need to see the crack. You need to notice that the pitch has changed.</p>'+
  '<aside class="case"><h2>Case study: three structures near Bengaluru International Airport</h2>'+
  '<p>As an Engineering Consultant with MSPL, I installed a wireless monitoring system at three locations near Bengaluru International Airport Ltd. The steps were:</p>'+
  '<ol><li><strong>Survey.</strong> Visit each structure to decide where sensors would capture its motion best.</li>'+
  '<li><strong>Train.</strong> Give the owner\u2019s team technical training on the system.</li>'+
  '<li><strong>Install.</strong> Set up five 3D vibration accelerometers (Resensys SenSpot) and three Senimax data acquisition devices that collect and transmit the data wirelessly.</li>'+
  '<li><strong>Monitor and report.</strong> Watch the incoming data and produce reports on each structure\u2019s vibration profile.</li></ol>'+
  '<p>Going wireless matters on structures like these because it avoids running long cables across them, which makes installation faster and less intrusive.</p></aside>'+
  '<h2>Why a baseline matters</h2>'+
  '<p>One vibration reading says very little, just as one blood-pressure reading says little about your health. The value is in the trend. The first job of a monitoring system is to establish what normal looks like for that specific structure. Everything after that is a comparison.</p>'+
  '<p>That is also where the next step lies: using AI and machine-learning methods to read continuous streams of sensor data and flag changes automatically. It is the subject of a talk I gave at the Conference and Exhibition on NDT and Sensors organised by ISNT and Tata Steel in Jamshedpur.</p>'}
];

function initSignal(){
  var canvas=$("#sig"), hero=$("#hero"); if(!canvas) return;
  var ctx=canvas.getContext("2d"), W=0,H=0, raf=0, last=0, t=0, visible=true, G=[], OMEGA=.22;
  var COLS=[[84,126,214],[34,160,160],[226,84,44],[238,160,52],[160,90,190]];
  // Gear trains in units of the gear module. "parent" gears drive "child" gears at a given angle.
  var TALL=[{n:36},{n:18,p:0,a:-35},{n:24,p:0,a:110},{n:14,p:2,a:-10},{n:20,p:1,a:50}];
  var BAND=[{n:20},{n:28,p:0,a:12},{n:16,p:1,a:-18},{n:24,p:2,a:14}];
  function layout(){
    var spec=(W/H>1.6)?BAND:TALL, i, g, pg, d, ang, minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
    G=spec.map(function(s){return {n:s.n,p:s.p,a:s.a===undefined?0:s.a*Math.PI/180}});
    G.forEach(function(g,i){
      if(g.p===undefined){g.x=0;g.y=0}
      else{pg=G[g.p];d=(pg.n+g.n)/2;g.x=pg.x+d*Math.cos(g.a);g.y=pg.y+d*Math.sin(g.a)}
      var r=g.n/2+.6;
      minx=Math.min(minx,g.x-r);maxx=Math.max(maxx,g.x+r);miny=Math.min(miny,g.y-r);maxy=Math.max(maxy,g.y+r);
    });
    var bw=maxx-minx,bh=maxy-miny, m=Math.min(W*.94/bw,H*.92/bh);
    var ox=W/2-(minx+bw/2)*m, oy=H/2-(miny+bh/2)*m;
    G.forEach(function(g,i){g.X=ox+g.x*m;g.Y=oy+g.y*m;g.m=m;g.col=COLS[i%COLS.length]});
  }
  function size(){
    var r=canvas.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2);
    W=r.width;H=r.height;canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);
    layout();
  }
  function rotations(tt){
    G[0].rot=tt*OMEGA;
    for(var i=1;i<G.length;i++){
      var g=G[i],pg=G[g.p],pc=2*Math.PI/g.n;
      g.rot=g.a+Math.PI+pc/2-(pg.rot-g.a)*pg.n/g.n;
    }
  }
  function drawGear(g){
    var m=g.m,n=g.n,r=n*m/2,ro=r+.55*m,rr=r-.65*m,p=2*Math.PI/n,k,j,ph,c=g.col;
    var rgb=c[0]+","+c[1]+","+c[2];
    ctx.save();ctx.translate(g.X,g.Y);
    ctx.beginPath();
    for(k=0;k<n;k++){
      ph=g.rot+k*p;
      ctx.lineTo(rr*Math.cos(ph-.31*p),rr*Math.sin(ph-.31*p));
      ctx.lineTo(ro*Math.cos(ph-.14*p),ro*Math.sin(ph-.14*p));
      ctx.lineTo(ro*Math.cos(ph+.14*p),ro*Math.sin(ph+.14*p));
      ctx.lineTo(rr*Math.cos(ph+.31*p),rr*Math.sin(ph+.31*p));
      ctx.lineTo(rr*Math.cos(ph+.5*p),rr*Math.sin(ph+.5*p));
    }
    ctx.closePath();
    ctx.fillStyle="rgba("+rgb+",.08)";ctx.fill();
    ctx.strokeStyle="rgba("+rgb+",.95)";ctx.lineWidth=Math.max(1.6,m*.28);ctx.lineJoin="round";ctx.stroke();
    // inner rim
    ctx.beginPath();ctx.arc(0,0,rr*.82,0,6.2832);ctx.lineWidth=1.2;ctx.strokeStyle="rgba("+rgb+",.5)";ctx.stroke();
    // lightening holes
    var holes=Math.max(3,Math.round(n/6)), hr=rr*.13, hd=rr*.55;
    for(j=0;j<holes;j++){
      ph=g.rot+j*6.2832/holes;
      ctx.beginPath();ctx.arc(hd*Math.cos(ph),hd*Math.sin(ph),hr,0,6.2832);
      ctx.lineWidth=1.4;ctx.strokeStyle="rgba("+rgb+",.75)";ctx.stroke();
    }
    // hub with keyway
    ctx.beginPath();ctx.arc(0,0,rr*.2,0,6.2832);ctx.fillStyle="rgba("+rgb+",.18)";ctx.fill();ctx.lineWidth=1.8;ctx.strokeStyle="rgba("+rgb+",.95)";ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(rr*.2*Math.cos(g.rot),rr*.2*Math.sin(g.rot));ctx.lineWidth=2;ctx.stroke();
    ctx.restore();
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    rotations(t);
    G.forEach(drawGear);
  }
  function loop(ts){
    if(!last)last=ts; var dt=Math.min((ts-last)/1000,.05); last=ts; t+=dt;
    draw();
    if(visible)raf=requestAnimationFrame(loop);
  }
  function onResize(){size();if(reduced){t=2;draw()}}
  size();
  if(reduced){t=2;draw()}else{raf=requestAnimationFrame(loop)}
  window.addEventListener("resize",onResize);
  var io=new IntersectionObserver(function(en){
    visible=en[0].isIntersecting;
    if(visible&&!reduced){last=0;cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
  });io.observe(hero);
  onCleanup(function(){visible=false;cancelAnimationFrame(raf);window.removeEventListener("resize",onResize);io.disconnect()});
}

/* ---------- Lightbox ---------- */
var lastFz=null;
function closeLb(){var l=$("#lb");l.classList.remove("show");l.setAttribute("aria-hidden","true");if(lastFz){try{lastFz.focus({preventScroll:true})}catch(e){}}}
function initFigures(){
  $$(".fz",view).forEach(function(b){
    b.addEventListener("click",function(){
      var im=$("img",b),l=$("#lb"),li=$("#lbimg");
      li.src=im.src;li.alt=im.alt;lastFz=b;l.classList.add("show");l.setAttribute("aria-hidden","false");
    });
  });
}
$("#lb").addEventListener("click",closeLb);
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&$("#lb").classList.contains("show"))closeLb()});

/* ---------- Nav indicator ---------- */
function setNav(page){
  var ind=$("#ind"), nav=$("#nav");
  $$("a[data-nav]",nav).forEach(function(a){
    var on=a.getAttribute("data-nav")===page;
    on?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current");
    if(on){ind.style.width=a.offsetWidth+"px";ind.style.transform="translateX("+a.offsetLeft+"px)"}
  });
}

/* ---------- Router ---------- */
var TITLES={home:"Abhiram Chavali | Systems integration, sensing and thermal energy",about:"About | Abhiram Chavali",projects:"Projects | Abhiram Chavali",articles:"Articles | Abhiram Chavali"};
var LABELS={home:"Home",about:"About",projects:"Projects",articles:"Articles"};
var current=null, busy=false, queued=false;

function parse(){
  var h=location.hash.replace(/^#\/?/,""), parts=h.split("/"), p=parts[0]||"home";
  if(!TITLES[p])p="home";
  return {page:p,sub:parts[1]||""};
}

function mount(page,sub){
  cleanups.forEach(function(fn){try{fn()}catch(e){}});cleanups=[];
  var html = page==="home"?renderHome():page==="about"?renderAbout():page==="projects"?renderProjects():(sub?renderArticle(sub):renderArticles());
  view.innerHTML=html;
  var title=TITLES[page];
  if(page==="articles"&&sub){var a=ARTICLES.filter(function(x){return x.id===sub})[0];if(a)title=a.title+" | Abhiram Chavali"}
  document.title=title;
  setNav(page);
  initReveal();initCopy();
  if(page==="home")initSignal();
  if(page==="about")initTimeline();
  if(page==="projects")initProjects(sub);
  if(page==="projects")initFigures();
  if(page==="articles")initReader();
  else initReader();
  window.scrollTo(0,0);
  try{view.focus({preventScroll:true})}catch(e){}
}

function fade(swap){
  var out=view.animate([{opacity:1},{opacity:0}],{duration:200,easing:"ease",fill:"forwards"});
  return out.finished.then(function(){
    swap();
    var inn=view.animate([{opacity:0},{opacity:1}],{duration:320,easing:"ease",fill:"forwards"});
    return inn.finished.then(function(){out.cancel();inn.cancel()});
  });
}

function route(first){
  var r=parse(), key=r.page==="articles"?"articles/"+r.sub:r.page;
  if(first){mount(r.page,r.sub);current=key;return}
  if(current===key){if(r.page==="projects")openProject(r.sub,true);return}
  if(busy){queued=true;return}
  current=key;
  if(reduced||!view.animate){mount(r.page,r.sub);return}
  busy=true;
  fade(function(){mount(r.page,r.sub)}).then(function(){busy=false;if(queued){queued=false;route()}});
}
window.addEventListener("hashchange",function(){route(false)});
window.addEventListener("resize",function(){setNav(parse().page)});

/* ---------- Theme ---------- */
(function(){
  var root=document.documentElement, saved=null;
  try{saved=localStorage.getItem("ac-theme")}catch(e){}
  var eff=saved||(window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
  root.setAttribute("data-theme",eff);
  $("#theme").addEventListener("click",function(){
    var n=root.getAttribute("data-theme")==="dark"?"light":"dark";
    root.setAttribute("data-theme",n);
    try{localStorage.setItem("ac-theme",n)}catch(e){}
  });
})();

(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(function(){setNav(parse().page)});
route(true);
})();
</script>
</body>
